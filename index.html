
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kho Tài Nguyên Game</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101827;
            color: white;
            text-align: center;
        }

        header {
            padding: 25px;
            background: #1e293b;
        }

        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }

        .game {
            background: #1e293b;
            padding: 25px;
            border-radius: 15px;
        }

        a {
            display: inline-block;
            padding: 14px 24px;
            margin-top: 15px;
            background: #22c55e;
            color: #07130a;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        footer {
            margin-top: 50px;
            color: #94a3b8;
        }
    </style>
</head>

<body>
    <header>
        <h1>🎮 KHO TÀI NGUYÊN GAME</h1>
        <p>Chia sẻ tài nguyên và hướng dẫn chơi game</p>
    </header>

    <div class="container">
        <div class="game">
            <h2>Tài nguyên game miễn phí</h2>
            <p>
                Tìm hướng dẫn và tài nguyên hữu ích
                dành cho game thủ.
            </p>

            <a href="https://example.com"
               target="_blank"
               rel="noopener noreferrer">
                XEM TÀI NGUYÊN
            </a>
        </div>

        <footer>
            Website thử nghiệm của tôi
        </footer>
    </div>
</body>
</html>
